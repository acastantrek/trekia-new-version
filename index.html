<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050816" />
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme-preference')
          if (stored === 'light' || stored === 'dark' || stored === 'mixed') {
            document.documentElement.setAttribute('data-theme', stored)
            return
          }
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', 'mixed')
      })()
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon-256.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Respaldo para clientes sin JS (data-fallback): main.tsx los retira y cada página pone
         los suyos con <Seo> -->
    <meta
      data-fallback
      name="description"
      content="Automatizamos procesos, conectamos tus sistemas y aplicamos IA para que tu empresa trabaje con menos tareas manuales. Diagnóstico gratuito."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta data-fallback property="og:type" content="website" />
    <meta data-fallback property="og:site_name" content="Trek.IA" />
    <meta data-fallback property="og:locale" content="es_ES" />
    <meta
      data-fallback
      property="og:title"
      content="Trek.IA — Automatización de procesos e IA para empresas"
    />
    <meta
      data-fallback
      property="og:description"
      content="Automatizamos procesos, conectamos tus sistemas y aplicamos IA para que tu empresa trabaje con menos tareas manuales. Diagnóstico gratuito."
    />
    <meta data-fallback property="og:url" content="https://www.trek-ia.com/" />
    <meta data-fallback property="og:image" content="https://www.trek-ia.com/og-image.png" />
    <meta data-fallback property="og:image:width" content="1200" />
    <meta data-fallback property="og:image:height" content="630" />
    <meta data-fallback name="twitter:card" content="summary_large_image" />
    <title data-fallback>Trek.IA — Automatización de procesos e IA para empresas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
