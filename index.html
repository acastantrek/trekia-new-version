<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050816" />
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme-preference')
          if (stored === 'light' || stored === 'dark' || stored === 'mixed') {
            document.documentElement.setAttribute('data-theme', stored)
            return
          }
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', 'mixed')
      })()
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon-256.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="Trek.IA crea software, automatizaciones e IA aplicada para hacer más eficientes las operaciones B2B."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Trek.IA — Operaciones conectadas</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
